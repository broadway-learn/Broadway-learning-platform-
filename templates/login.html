<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student login - Broadway Learn</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><div class="brand">Broadway <span>Learn</span></div></header>
  <main>
    <div class="card">
      <h1>Student login</h1>
      <p class="muted">Enter the email you signed up with. Only verified students can open courses.</p>
      {% if message %}<p style="color:#b91c1c;">{{ message }}</p>{% endif %}
      <form method="POST">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <button class="btn" type="submit">Log in</button>
      </form>
    </div>
  </main>
  <footer>Open source · Built for the Broadway community</footer>
</body>
</html>
