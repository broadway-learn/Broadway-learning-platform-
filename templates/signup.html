<!DOCTYPE html>
<html>
<head>
  <title>Broadway Learn - Student Sign-up</title>
</head>
<body>
  <h1>Student Sign-up</h1>
  <p>We only collect what we need to confirm you are a student.</p>
  <form method="POST">
    <p>Full name:<br><input type="text" name="full_name" required></p>
    <p>Email:<br><input type="email" name="email" required></p>
    <p>School name:<br><input type="text" name="school" required></p>
    <p><label><input type="checkbox" name="consent" required>
      I agree that my details may be used to verify I am a student.</label></p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
